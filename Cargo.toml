[package]
name = "tauri-plugin-pencilkit"
version = "0.1.0"
edition = "2021"
authors = ["Filipe Laborde-Basto"]
description = "High-performance Apple PencilKit integration for Tauri v2 on iPadOS"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mindflowgo/tauri-plugin-pencilkit"
links = "tauri-plugin-pencilkit"
build = "build.rs"

[lib]
name = "tauri_plugin_pencilkit"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }

[target.'cfg(target_os = "ios")'.dependencies.tauri]
version = "2.12"
features = ["wry"]
default-features = false
